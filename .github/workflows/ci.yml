name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  test:
    name: Test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # go.sum is generated by the tidy step below, so disable the cache
          # that would otherwise require it to exist up front.
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: gofmt
        continue-on-error: true
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test (race)
        run: go test ./... -race -count=1

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Real target platforms (full nftables / SO_ORIGINAL_DST support).
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          # Buildability checks for the cross-platform stubs (no firewall).
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "${{ matrix.goos }}" = "linux" ]; then
            # Real target: keep the binary and upload it as an artifact.
            go build -trimpath -ldflags "-s -w" \
              -o "smoker-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/smoker
          else
            # Stub platforms: buildability check only.
            go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/smoker
          fi

      - name: Upload binary artifact
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: smoker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: smoker-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
