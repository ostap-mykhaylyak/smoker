name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  test:
    name: Test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # go.sum is generated by the tidy step below, so disable the cache
          # that would otherwise require it to exist up front.
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: gofmt
        continue-on-error: true
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test (race)
        run: go test ./... -race -count=1

  build:
    name: Build linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o "smoker-linux-${{ matrix.goarch }}" ./cmd/smoker

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoker-linux-${{ matrix.goarch }}
          path: smoker-linux-${{ matrix.goarch }}
          if-no-files-found: error
